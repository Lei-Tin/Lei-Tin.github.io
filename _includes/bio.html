<section id="bio">
  <section id="img-wrapper">
    <img src="{{site.data.author.dp}}" alt="" />
  </section>
  <section id="bio-wrapper">
    <div id="text-wrapper">{{site.data.author.description}}</div>
    <div id="social-wrapper">
      {% for i in site.data.author.contact %}
      <a href="{{i.url}}" target="_blank" rel="noopener noreferrer" aria-label="{{ i.label | default: i.title | escape }}" title="{{ i.label | default: i.title | escape }}">
        {% if i.icon %}
        <img src="{{site.baseurl}}/assets/icons/{{i.icon}}" alt="" />
        {% else %}
        <img src="{{site.baseurl}}/assets/icons/{{i.title}}.png" alt="" />
        {% endif %}
      </a>
      {%endfor%}
    </div>
  </section>
</section>
